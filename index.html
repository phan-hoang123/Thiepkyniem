<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            height: 100%; overflow: hidden; 
            background: #fdf2f2;
        }
        
        /* Khung chứa các trang web của bạn */
        iframe { 
            width: 100%; height: 100%; 
            border: none; display: block; 
        }

        /* Nút Đĩa than phát nhạc xoay xoay ở góc */
        #music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #fb7185;
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 24px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(251, 113, 133, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            /* Hiệu ứng xoay tròn */
            animation: spin 4s linear infinite;
            transition: all 0.3s;
        }

        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }

        /* Khi nhạc tắt thì đĩa ngừng xoay và mờ đi */
        .paused { 
            animation: none !important; 
            opacity: 0.5; 
            background: #cbd5e1 !important;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

    <button id="music-btn" class="paused" onclick="toggleMusic()" title="Bật/Tắt Nhạc">🎵</button>

    <iframe src="login.html"></iframe>

    <script>
        var music = document.getElementById("bg-music");
        var btn = document.getElementById("music-btn");
        var isPlaying = false;

        // Hàm bật/tắt nhạc thủ công
        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                btn.classList.add("paused");
            } else {
                music.play();
                btn.classList.remove("paused");
            }
            isPlaying = !isPlaying;
        }

        // Nhận lệnh bật nhạc tự động từ trang login truyền ra
        window.addEventListener('message', function(e) {
            if (e.data === 'play' && !isPlaying) {
                music.play();
                isPlaying = true;
                btn.classList.remove("paused");
            }
        });
    </script>
</body>
</html>
