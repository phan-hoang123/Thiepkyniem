    <script>
    function createHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.style.position = 'fixed';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = '100vh';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        heart.style.opacity = Math.random() * 0.5 + 0.3;
        heart.style.zIndex = '-1';
        heart.style.animation = `floatUp ${Math.random() * 3 + 4}s linear forwards`;
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 7000);
    }
    
    // Thêm CSS thẳng vào web cho trái tim bay
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes floatUp {
            to { transform: translateY(-120vh) rotate(${Math.random() * 360}deg); opacity: 0; }
        }
    `;
    document.head.appendChild(style);

    setInterval(createHeart, 500); // Cứ 0.5s thả 1 trái tim
</script>
